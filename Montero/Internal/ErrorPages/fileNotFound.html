<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./common/common.css">
    <title>File not found</title>
</head>
<body>
    <main>
        <img src="./common/cannot_find_file.png" alt="Stop sign with a X" style="width: 120px; float: left; margin: 5px; padding-bottom: 50px;" draggable="false">
        
        <div class="text">
            <h1>File not found</h1>
            <p>Montero couldn't find this file. Try making this steps:</p>
            <ul>
                <li>Check to see if the file was moved, renamed or deleted.</li>
                <li>Check the file name for any capitalization or typing errors.</li>
            </ul>
        </div>    
    </main>
</body>
</html>
